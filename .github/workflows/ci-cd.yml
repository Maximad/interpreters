name: CI, Image Publish and VPS Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow operation
        type: choice
        options: [verify, check-vps, deploy-vps]
        default: verify

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'check-vps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @im/api
      - run: npm run lint:ci
      - run: npm test -w @im/api
      - run: npm run compose:verify
      - run: make local
      - run: node scripts/smoke-test.mjs
      - name: Collect failed smoke-test logs
        if: failure()
        run: >-
          docker compose -p interpreters-local --env-file .env.example
          -f infra/docker-compose.yml -f infra/docker-compose.local.yml
          logs --no-color --tail=45 migrate api web nginx

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_api: ${{ steps.registry.outputs.namespace }}/api@${{ steps.api.outputs.digest }}
      image_web: ${{ steps.registry.outputs.namespace }}/web@${{ steps.web.outputs.digest }}
      image_nginx: ${{ steps.registry.outputs.namespace }}/nginx@${{ steps.nginx.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set registry namespace
        id: registry
        run: |
          namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          for component in api web nginx; do
            {
              echo "${component}_tags<<TAGS"
              echo "$namespace/$component:sha-$GITHUB_SHA"
              if [ "$GITHUB_REF" = refs/heads/main ]; then
                echo "$namespace/$component:latest"
              elif [ "$GITHUB_REF_TYPE" = tag ]; then
                echo "$namespace/$component:$GITHUB_REF_NAME"
              fi
              echo TAGS
            } >> "$GITHUB_OUTPUT"
          done
      - name: Build and publish API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.api_tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.web_tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish nginx
        id: nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/nginx.Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.nginx_tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

  check-vps:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-vps'
    runs-on: ubuntu-latest
    steps:
      - name: Read interpreter deployment status
        uses: appleboy/ssh-action@v1.2.2
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: VPS_APP_DIR
          script: |
            set -eu
            if [ -e "${VPS_APP_DIR:-/opt/interpreters}/.git" ]; then
              git -C "${VPS_APP_DIR:-/opt/interpreters}" log -1 --format='Checkout %h %s'
            else
              echo 'Interpreter checkout could not be located in the configured deployment directory.'
            fi
            read_containers() {
              "$@" ps -a --filter name=interpreters --format '{{.Names}} {{.Image}} {{.Status}}'
            }
            if ! read_containers docker && ! read_containers sudo -n docker; then
              echo 'The deployment account needs access to Docker to report container status.' >&2
              exit 1
            fi

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-vps' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: interpreters-vps
      cancel-in-progress: false
    steps:
      - name: Deploy the verified images
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_ENV_FILE: ${{ secrets.VPS_ENV_FILE }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          IMAGE_API: ${{ needs.publish.outputs.image_api }}
          IMAGE_WEB: ${{ needs.publish.outputs.image_web }}
          IMAGE_NGINX: ${{ needs.publish.outputs.image_nginx }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 10m
          envs: DEPLOY_SHA,VPS_APP_DIR,VPS_ENV_FILE,GHCR_USERNAME,GHCR_PAT,IMAGE_API,IMAGE_WEB,IMAGE_NGINX
          script: |
            set -eu
            cd "${VPS_APP_DIR:-/opt/interpreters}"
            ENV_FILE="${VPS_ENV_FILE:-$PWD/.env}"

            if [ "$ENV_FILE" = "$PWD/.env" ] && git ls-files --error-unmatch .env >/dev/null 2>&1; then
              echo 'Copy the VPS environment file outside the checkout and set VPS_ENV_FILE before updating this checkout.' >&2
              exit 1
            fi
            test -r "$ENV_FILE"
            git fetch --no-tags origin "$DEPLOY_SHA"
            git switch --detach "$DEPLOY_SHA"

            if [ -n "${GHCR_PAT:-}" ]; then
              printf '%s\n' "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi
            ENV_FILE="$ENV_FILE" ./scripts/deploy.sh
