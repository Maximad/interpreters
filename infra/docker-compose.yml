services:
  nginx:
    image: ${IMAGE_NGINX:-ghcr.io/your-org/interpreters-nginx:latest}
    container_name: interpreters-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${IMAGE_WEB:-ghcr.io/your-org/interpreters-web:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  migrate:
    image: ${IMAGE_API:-ghcr.io/your-org/interpreters-api:latest}
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: ${REDIS_URL}
      MEILISEARCH_URL: ${MEILISEARCH_URL}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      MEILISEARCH_INTERPRETERS_INDEX: ${MEILISEARCH_INTERPRETERS_INDEX}
    command: ["npm", "run", "prisma:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  api:
    image: ${IMAGE_API:-ghcr.io/your-org/interpreters-api:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      REDIS_URL: ${REDIS_URL}
      MEILISEARCH_URL: ${MEILISEARCH_URL}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILISEARCH_INTERPRETERS_INDEX: ${MEILISEARCH_INTERPRETERS_INDEX}
      SEARCH_SYNC_INTERVAL_MS: ${SEARCH_SYNC_INTERVAL_MS}
      NOTIFICATION_QUEUE_INTERVAL_MS: ${NOTIFICATION_QUEUE_INTERVAL_MS}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE}
      DAILY_DIRECT_INQUIRY_LIMIT: ${DAILY_DIRECT_INQUIRY_LIMIT}
      DAILY_BROADCAST_LIMIT: ${DAILY_BROADCAST_LIMIT}
      BROADCAST_RECIPIENT_CAP: ${BROADCAST_RECIPIENT_CAP}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 25s
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  meilisearch:
    image: getmeili/meilisearch:v1.8
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7700/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

volumes:
  postgres_data:
  meili_data:
  redis_data:

networks:
  proxy:
    external: true
