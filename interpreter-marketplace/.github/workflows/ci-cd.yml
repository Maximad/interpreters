name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interpreter-marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            interpreter-marketplace/package.json
            interpreter-marketplace/apps/api/package.json
            interpreter-marketplace/apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Prisma validate
        run: npm run prisma:generate -w @im/api

      - name: Lint (non-interactive)
        env:
          CI: true
        run: npm run lint

      - name: Type/build check
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            export PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            export BRANCH="main"
            cd "$PROJECT_DIR"
            ./scripts/deploy.sh
